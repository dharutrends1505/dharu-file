<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #1f2937;
        }

        .welcome-container {
            width: 90%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: #eef2ff;
            font-size: 38px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 15px 25px;
            background: #6366f1;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }

        .button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="welcome-container">

        <div class="icon">👋</div>

        <h1>Welcome!</h1>

        <p>
            We're glad you're here.<br>
            Explore, discover, and get started today.
        </p>

        <a href="#" class="button">
            Get Started
        </a>

        <div class="footer">
            Thank you for visiting ❤️
        </div>

    </div>

</body>
</html>
