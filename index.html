<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.12), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.10), transparent 35%),
                #f8fafc;
            color: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #e8edf5;
            border-radius: 28px;
            padding: 60px 40px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.03);
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #3b82f6
            );

            color: white;
            font-size: 34px;
            font-weight: 700;

            box-shadow:
                0 12px 28px rgba(99, 102, 241, 0.25);
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .description {
            max-width: 450px;
            margin: 0 auto;

            color: #64748b;
            font-size: 17px;
            line-height: 1.7;
        }

        .divider {
            width: 45px;
            height: 4px;

            margin: 30px auto;

            border-radius: 20px;

            background: linear-gradient(
                90deg,
                #6366f1,
                #3b82f6
            );
        }

        .message {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 24px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .welcome-card {
                padding: 48px 25px;
                border-radius: 24px;
            }

            .logo {
                width: 68px;
                height: 68px;
                font-size: 30px;
                border-radius: 21px;
            }

            h1 {
                font-size: 33px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="welcome-card">

            <div class="logo">
                D
            </div>

            <h1>Welcome</h1>

            <p class="description">
                Welcome to our official website.
                We're glad you're here.
            </p>

            <div class="divider"></div>

            <p class="message">
                Thank you for visiting.
            </p>

        </div>

        <div class="footer">
            © 2026 • All rights reserved
        </div>

    </main>

</body>
</html>
